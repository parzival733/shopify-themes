name: Deploy Atelier Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy static storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check front-end entry points and JavaScript
        shell: bash
        run: |
          test -s frontend/index.html
          test -s frontend/assets/css/main.css
          node --check frontend/assets/js/app.js
          node --check frontend/assets/js/catalog.js
          grep -q 'id="main"' frontend/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/
      - uses: actions/deploy-pages@v4
        id: deployment
