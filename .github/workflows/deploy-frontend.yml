name: Verify Atelier Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML entry points and JavaScript syntax
        run: |
          test -s frontend/index.html
          test -s frontend/assets/css/main.css
          test -s frontend/assets/css/modern.css
          grep -q 'modern.css' frontend/index.html
          test -s frontend/404.html
          node --check frontend/assets/js/app.js
          node --check frontend/assets/js/catalog.js
          grep -q 'id="main"' frontend/index.html
