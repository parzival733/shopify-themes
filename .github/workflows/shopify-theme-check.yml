name: Shopify Theme Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-check:
    name: Validate theme Liquid and JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI and theme support
        run: npm install --global @shopify/cli @shopify/theme

      - name: Run Theme Check
        run: shopify theme check --fail-level error
